<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QVAC Team Retro Question Generator</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #f4f7f6;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #1e2b27;
    display: flex;
    justify-content: center;
    padding: 48px 20px;
  }
  .wrap { width: 100%; max-width: 560px; }
  .card {
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 2px 14px rgba(20,50,40,0.08);
    padding: 34px 36px;
  }
  .brand { font-size: 0.7rem; letter-spacing: 3px; text-transform: uppercase; color: #178a6a; font-weight: 700; margin-bottom: 6px; }
  h1 { font-size: 1.5rem; margin: 0 0 6px; color: #142a22; font-weight: 800; }
  .subtitle { color: #5b7166; font-size: 0.9rem; margin-bottom: 26px; }
  .field-label { font-size: 0.78rem; color: #5b7166; margin-bottom: 6px; font-weight: 600; }
  textarea {
    width: 100%;
    padding: 11px 12px;
    border-radius: 8px;
    border: 1px solid #c9d9d2;
    background: #fbfdfc;
    color: #1e2b27;
    font-family: inherit;
    font-size: 0.95rem;
    margin-bottom: 16px;
    min-height: 90px;
    resize: vertical;
  }
  textarea:focus { outline: none; border-color: #178a6a; }
  button.action {
    padding: 11px 24px;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    background: #178a6a;
    color: #fff;
  }
  button.action:hover:not(:disabled) { background: #12694f; }
  button.action:disabled { opacity: 0.4; cursor: not-allowed; }
  .status { margin-top: 14px; font-size: 0.85rem; color: #7c8f86; min-height: 1.2em; }
  .result-list { margin-top: 22px; list-style: none; padding: 0; }
  .result-list li {
    padding: 14px 16px;
    background: #f0f8f4;
    border-left: 3px solid #178a6a;
    border-radius: 6px;
    margin-bottom: 10px;
    font-size: 0.98rem;
    line-height: 1.5;
    color: #1e2b27;
  }
  .footer-note { color: #7c8f86; font-size: 0.78rem; text-align: center; margin-top: 22px; }
  .spinner {
    display: inline-block;
    width: 12px; height: 12px;
    border: 2px solid #d3e6dd;
    border-top-color: #178a6a;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="brand">On-Device Retro Facilitator</div>
      <h1>Team Retro Question Generator</h1>
      <p class="subtitle">Describe your team/sprint context, get 4-5 real discussion questions.</p>

      <div class="field-label">TEAM / SPRINT CONTEXT</div>
      <textarea id="contextInput" placeholder="e.g. 5-person team, first sprint after a major reorg, shipped a big feature two days late"></textarea>
      <button class="action" id="generateBtn">Generate Questions</button>
      <div class="status" id="status"></div>
      <ul class="result-list" id="resultList"></ul>
    </div>

    <p class="footer-note">Everything runs locally on your machine. No text ever leaves this device.</p>
  </div>

  <script>
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    const contextInput = document.getElementById('contextInput');
    const generateBtn = document.getElementById('generateBtn');
    const status = document.getElementById('status');
    const resultList = document.getElementById('resultList');

    async function generate() {
      const context = contextInput.value.trim();
      if (!context) return;
      generateBtn.disabled = true;
      resultList.innerHTML = '';
      status.innerHTML = '<span class="spinner"></span>Generating questions...';

      try {
        const res = await fetch('/api/retro-questions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ context }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        status.textContent = '';
        resultList.innerHTML = data.questions.map(q => `<li>${escapeHtml(q)}</li>`).join('');
      } catch (err) {
        status.textContent = 'Error: ' + err.message;
      } finally {
        generateBtn.disabled = false;
      }
    }

    generateBtn.addEventListener('click', generate);
  </script>
</body>
</html>
